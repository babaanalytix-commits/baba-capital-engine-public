# strategies_catalogue/oracle.yaml
# ORACLE — Prediction-Market Trading (v1 codename: ATLAS, Polymarket)
# ---------------------------------------------------------------------------

id: oracle
display_name: "ORACLE — Prediction Markets"
status: beta
default_state: paper

description: |
  Directional trading on prediction-market outcomes. Today's
  implementation (v1 codename ATLAS) trades binary YES/NO markets on
  Polymarket using a strategy engine that scores each market on
  expiration timing, liquidity depth, momentum, and recent observer
  policy outcomes. Different mechanics from perpetuals: markets resolve
  to 0 or 1, no funding, no leverage; positions are token holdings.

what_it_trades:
  - "YES / NO outcome tokens on Polymarket binary markets"
  - "Position sizes set by signal confidence + capital cap"
  - "SL via re-evaluating the market and selling tokens (no exchange-side stops)"
  - "Future expansion: cross-platform arb (Kalshi, Manifold)"

supported_venues: [polymarket]

risks:
  - "Binary settlement risk — a NO position pays $0 if YES resolves"
  - "Liquidity risk — exit slippage on shallow markets can erase edge"
  - "Resolution risk — disputes / oracle delays can lock capital"
  - "SL via observer-policy re-eval is slower than exchange-side stops
    (cadence ~10 min vs perp's < 1s)"
  - "Capital lock-up — positions held until market resolves OR sold (positions
    in deep red can be hard to exit)"

when_off_means: |
  PAUSE: blocks new ORACLE entries. Existing positions are HELD; observer
  policies still evaluate them but do not close on observer signals
  (only on hard SL or resolution). Use FLATTEN command to dump all
  ORACLE positions immediately at market.

when_on_means: |
  LIVE: ATLAS strategy engine evaluates new markets, scores them via
  observer policies, opens positions via semi_auto_decisions or auto
  (depending on policy enable state). Existing positions resume full
  management. 60-min grace window blocks auto-opens after re-enable.

enable_preconditions:
  - "ATLAS service running (com.babaanalytics.atlas)"
  - "Observer service running (com.babaanalytics.atlas.observer)"
  - "Free pUSD >= $20 on Polymarket"
  - "ATLAS go-live tracker shows all milestones M1-M6 GREEN
    (atlas_golive_status.json)"

adjacent_workers:
  - com.babaanalytics.atlas
  - com.babaanalytics.atlas.observer
  - com.baba.atlas-golive-tracker
  - com.baba.atlas.daily-proof

audit_log_category: oracle
ui_color: "#9b59b6"

max_concurrent: 8

active_strategies:
  - id: pce_v2
    description: "PCE-anchored shadow-model fade — emits when Polymarket-implied probability diverges from our PCE model on next print."
    direction: "long YES or long NO depending on shadow vs market"
    size_usd: 50
    tap_to_approve: true

  - id: commitment_anchor_fade_v1
    description: "Long-horizon fade of markets anchored to unlikely commitments (e.g. specific delistings, partnership announcements)."
    direction: "long NO on overpriced YES commitments"
    size_usd: "10–25"
    tap_to_approve: true

  - id: oracle_macro_consensus_fade_v1
    description: |
      Asymmetric small-bet fades on heavily-concentrated US macro markets.
      When consensus market prices ≥93% and tails ≤7% (e.g. June FOMC
      "no change" at 97.6%), the cheap tail is structurally underpriced.
      $5 bet on a tail at $0.005 pays $1,000 if hit (200× payoff).
      Shipped 2026-05-24. See docs/oracle_consensus_fade.md.
    direction: "long YES on cheap-tail (≤ 7%) markets"
    size_usd: 5
    sl: "probability drift past 0.20"
    tp: "market resolves YES, OR time-stop at resolution − 1h"
    tap_to_approve: true
    data_source: "Polymarket gamma API + hand-curated US macro calendar (both public, free)"

  - id: oracle_ai_v1
    description: |
      Two-layer AI judge over Polymarket. Gemini 2.5 Flash triages 100s of
      markets per scan (volume layer, ~$0.0025/batch), Claude Sonnet
      deep-judges the top candidates (precision layer, ~$0.005/judgment).
      Judge applies a POST-EVENT GUARD prompt forcing it to answer
      WHEN the resolving event occurs + whether it's already past, so
      markets in oracle-settlement drift (e.g. "SPX opens up or down" at
      99.95¢ four hours after the open) get BLOCKED not chased.
      Shipped 2026-05-26. See docs/oracle_ai_v1.md.
    direction: "PASS verdicts on either YES or NO depending on judge"
    size_usd: "1–5 (confidence × MAX_SIZE)"
    sl: "no exchange-side stops (Polymarket); time-stop at resolution"
    tp: "market resolves in our favour OR judge re-evaluates BLOCKED"
    tap_to_approve: true
    delivery: "Telegram (bmi-premium channel) + web dashboard (babacapital.app/app)"
    data_source: "Polymarket gamma API + Gemini Flash + Claude Sonnet"
    safety_layers:
      - "Extreme-price hard skip (yes_price >= 0.97 or <= 0.03 → skip in markets.py)"
      - "Daily cost cap ($0.50/day, $5 total Anthropic budget)"
      - "Rapid-loss auto-pause (24h cumulative loss > $10 → auto-shadow)"
      - "Single-trade blowup detection (>50% loss in <4h → auto-shadow)"
      - "Burn-without-resolution (>$2 spent in 7d with zero resolved → auto-shadow)"
      - "Signal-to-PnL ratio gate after 200 calls (must be >1.0)"
    delivery_modes:
      - "SHADOW (gate at emission; signals logged to side-channel but never fired)"
      - "MANUAL (current default; Telegram with tap-to-approve)"
      - "AUTO_VETO (60s countdown + Skip + Pause-All buttons; default off, env-flippable)"
      - "AUTO_INSTANT (execute first, notify after; future, gated on proof)"

notes: |
  Status "beta" because ATLAS is in go-live runway (gate G1-G6 tracker).
  Bumps to "live" after Yomi flips it to live trading post-tracker green.
  Until then, default_state stays "paper". Don't enable LIVE without
  reading the ATLAS go-live tracker output for the day.

  2026-05-24: Added oracle_macro_consensus_fade_v1 — first asymmetric
  consensus-fade strategy. Live signal at v0.5 ship: $5 on "Fed +50bps
  June 2026" at YES $0.0025 (0.25% implied) → ~2,000× payoff if hit.
