    # for the USDC↔WHYPE balancing swap, then fires prjx increaseLiquidity
    # on the matching WHYPE/USDC managed position. Same lessons baked in
    # as #419 Aerodrome version (shortage-only swap, mins=1, retry-w-backoff,
    # dynamic gas estimation).
    # DEFAULT: dry-run. Flip LP_AUTO_EXECUTE_PRJX_TOPUP=true after review.
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && unset PYTHONHOME PYTHONPATH PYTHONSTARTUP PYTHONUSERBASE && export PYTHONNOUSERSITE=1 && for f in engine/.env .env.lp ops/bmi/.env; do [ -f \"$f\" ] && set -a && . \"$f\" && set +a; done && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.strategies.lp_agile.idle_deploy_dispatcher_prjx"
    schedule_interval_sec: 900       # 15 min
    max_runtime_sec: 240              # OpenOcean swap + increaseLiquidity ~2 min worst case
    max_concurrency: 1
    shadow_mode: false               # job is itself dry-run-gated by env flag
    depends_on: []
    note: "#414. Dry-run until LP_AUTO_EXECUTE_PRJX_TOPUP=true. Mirror of Aerodrome dispatcher for HyperEVM."

