    # 2026-06-03 (#376): flipped LIVE alongside LP_AUTO_EXECUTE_AERO=true
    # in engine/.env. Aero only; prjx still env-gated off.
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && unset PYTHONHOME PYTHONPATH PYTHONSTARTUP PYTHONUSERBASE && export PYTHONNOUSERSITE=1 && for f in engine/.env .env.lp ops/bmi/.env; do [ -f \"$f\" ] && set -a && . \"$f\" && set +a; done && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.workers.lp_rebalance_dispatcher"
