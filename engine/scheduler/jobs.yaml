    schedule_interval_sec: 300
    max_runtime_sec: 120
    max_concurrency: 1
    shadow_mode: false              # LIVE — read-only audit, no capital impact
    depends_on: []
    note: "#333 D2 — every 5min: walks data_alignment_registry.yaml, fetches each metric from each surface, writes engine/_reports/alignment_audit.json."

  - name: drift_alerter
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && unset PYTHONHOME PYTHONPATH PYTHONSTARTUP PYTHONUSERBASE && export PYTHONNOUSERSITE=1 && for f in engine/.env .env.lp ops/bmi/.env; do [ -f \"$f\" ] && set -a && . \"$f\" && set +a; done && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m ops.risk.drift_alerter --quiet"
    schedule_interval_sec: 600
    max_runtime_sec: 60
    max_concurrency: 1
    shadow_mode: false              # LIVE — operator alerts
    depends_on: [trustless_alignment_audit]
    note: "#333 D4 — every 10min: reads alignment_audit.json, sends [BROKEN] tagged drift alerts to operator TG with 1h dedup."

  # ── #349 MD venue↔registry reconciler ────────────────────────────────
  - name: md_venue_reconciler
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && unset PYTHONHOME PYTHONPATH PYTHONSTARTUP PYTHONUSERBASE && export PYTHONNOUSERSITE=1 && for f in engine/.env .env.lp ops/bmi/.env; do [ -f \"$f\" ] && set -a && . \"$f\" && set +a; done && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.audit.md_venue_reconciler --quiet"
    schedule_interval_sec: 600
    max_runtime_sec: 60
    max_concurrency: 1
    shadow_mode: false              # LIVE — read-only audit, no capital impact
    depends_on: []
    note: "#349 — every 10min: compares HL+Pacifica+GRVT venue truth vs md.db. Sends [BROKEN] tagged operator TG alert when VENUE_ONLY or REGISTRY_ONLY drift detected. Silent-when-healthy."

  # ── Phase 5 paper workers (SHADOW until Yomi flips PAPER_MIRROR_*) ──
  # Paper writes are physically routed to mock venues; nothing here can
  # touch a real venue. SHADOW mode at the scheduler level means we won't
  # even fork these processes until Yomi opts in. The per-pillar mirror
  # flag (PAPER_MIRROR_ORACLE / PAPER_MIRROR_MD_AI) controls whether
  # there are any paper rows for the workers to claim.

  - name: paper_oracle_worker
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.workers.paper_executor --pillar oracle"
    schedule_interval_sec: 10
    max_runtime_sec: 0
    max_concurrency: 1
    shadow_mode: false
    depends_on: []
    note: "Phase 5 paper SQL queue drainer for ORACLE — mock Polymarket. SHADOW until Yomi sets PAPER_MIRROR_ORACLE=1."

  - name: paper_md_ai_worker
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.workers.paper_executor --pillar md_ai"
    schedule_interval_sec: 10
    max_runtime_sec: 0
    max_concurrency: 1
    shadow_mode: true
    depends_on: []
    note: "Phase 5 paper SQL queue drainer for MD AI — mock HL/GRVT/Pacifica. SHADOW until Yomi sets PAPER_MIRROR_MD_AI=1."

  - name: paper_valuation
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.paper.valuation --pillar all"
    schedule_interval_sec: 300            # 5 min mark-to-market sweep
    max_runtime_sec: 180
    max_concurrency: 1
    shadow_mode: true
    depends_on: []
