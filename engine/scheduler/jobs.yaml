    schedule_interval_sec: 21600    # 6 hours
    max_runtime_sec: 120
    max_concurrency: 1
    shadow_mode: false
    depends_on: []
    note: "#420 part C+E. Periodic APR discovery + cross-chain bridge alert."

  - name: lp_rebalance_alerter
    # 2026-06-04 (#420). Reads capital_optimizer proposals, fires Telegram
