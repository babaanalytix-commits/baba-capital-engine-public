    max_runtime_sec: 240            # 4 min hard cap (multi-tx Aero takes ~90s)
    max_concurrency: 1              # single-process: in-memory + disk cooldown
    shadow_mode: false              # LIVE 2026-06-03 — fires on approval+env-flag match
    depends_on: []
    note: "Phase D4 (#375). Reads approval_store, fires executor on match. Marks consumed after broadcast. Operator-only Telegram receipts. LIVE 2026-06-03."

  - name: lp_idle_deploy_dispatcher
