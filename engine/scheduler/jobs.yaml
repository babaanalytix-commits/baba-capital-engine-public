  - name: portfolio_allocation_v2
    # 2026-06-04 (#416). 3-pillar portfolio monitor (LP/MD/ORACLE at 60/25/15)
    # with 10% drift band. Writes engine/_reports/treasury_latest.json which
    # PWA Capital tab consumes. Sends Telegram alert when any pillar drifts
