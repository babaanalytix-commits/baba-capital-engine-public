# engine/scheduler/jobs.yaml
#
# Phase 2 job scheduler config — single source of "when to scan".
#
# Read by `python -m engine.scheduler` at startup. Re-read on every
# scheduler restart (bouncing com.baba.scheduler.plist is the way to
# apply changes). The 41 launchd plists are still live and authoritative
# until the corresponding job here flips `shadow_mode: false` AND Yomi
# manually disables (`launchctl bootout`) the legacy plist.
#
# FIELD REFERENCE
#   name                   — unique key (used as job_id in DB)
#   cmd                    — shell command (passed to subprocess shell=True)
#   schedule_interval_sec  — fire every N seconds (omit/null for one-shot)
#   max_runtime_sec        — SIGTERM after this; SIGKILL 5s later
#   max_concurrency        — concurrent runs allowed (default 1)
#   shadow_mode            — true = log "would have run", don't fork
#                            false = LIVE (real subprocess.Popen)
#   depends_on             — list of job names; if any RUNNING, we skip
#   note                   — human note
#
# PHASE 2a → 2d MIGRATION
#   2a  — all jobs shipped with shadow_mode: true (this file)
#   2b  — pipeline_health_watcher flipped to false; corresponding plist
#         booted out. First live job.
#   2c  — flip oracle_close_drift / oracle_lifecycle once 2b proves stable.
#   2d  — flip oracle_scan / md_ai_scan / md_ai_auto_executor.
# Each flip = a Yomi-controlled diff to this file + a launchd bootout.

jobs:

  # ── ORACLE pillar ────────────────────────────────────────────────────

  - name: oracle_scan
    cmd: engine/run.sh oracle-scan
    schedule_interval_sec: 5400    # 90 min (matches existing plist 2026-05-26)
    max_runtime_sec: 1800          # 30 min hard cap
    max_concurrency: 1             # strategy code also holds its own lockfile
    shadow_mode: true
    depends_on: []
    note: "ORACLE AI multi-source scanner + judge + Telegram. Replaces com.baba.engine-oracle-scanner."

  - name: oracle_lifecycle
    cmd: engine/run.sh oracle-lifecycle
    schedule_interval_sec: 300     # 5 min — only exit-enforcement on Polymarket
    max_runtime_sec: 180
    max_concurrency: 1
    shadow_mode: true
    depends_on: []
    note: "Poll-based exit enforcement for ORACLE positions. Replaces com.baba.engine-oracle-lifecycle."

  - name: oracle_close_drift
    cmd: engine/run.sh oracle-close-drift --live
    schedule_interval_sec: 900     # 15 min — matches reconciler cadence
    max_runtime_sec: 180
    max_concurrency: 1
    shadow_mode: true
    depends_on: [oracle_lifecycle] # don't fight lifecycle for the same registry rows
    note: "Continuous close-drift reconciler (task #213). Replaces com.baba.oracle-close-drift."

  # ── MD AI pillar ─────────────────────────────────────────────────────

  - name: md_ai_scan
    cmd: engine/run.sh md-scan
    schedule_interval_sec: 1800    # 30 min — matches existing engine-md-scanner plist
    max_runtime_sec: 900
    max_concurrency: 1
    shadow_mode: true
    depends_on: []
    note: "MD AI directional signal scanner. Replaces com.baba.engine-md-scanner."

  - name: md_ai_auto_executor
    # 10-sec polling — Phase 3 (queue primitives) will replace this with a
    # long-running daemon. For Phase 2 we keep the existing ticker shape.
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.strategies.md_ai.auto_executor"
    schedule_interval_sec: 10
    max_runtime_sec: 60
    max_concurrency: 1
    shadow_mode: true
    depends_on: []
    note: "MD AI auto-exec ticker. Stays in SHADOW through Phase 2 — Phase 3 swaps it for a long-running queue worker."

  # ── Phase 3 queue workers (SHADOW) ───────────────────────────────────
  # Phase 3 ARCHITECTURE — drain the SQL queue alongside the legacy
  # auto_executor. SHADOW by default: claims rows, marks them done with
  # error="shadow_no_op", does NOT touch the venue. The jsonl + legacy
  # auto_executor remain authoritative through Phase 3. Cutover happens
  # in Phase 4 once parity_queue_check is clean for 48h.

  - name: oracle_queue_worker
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.workers.auto_executor --pillar oracle"
    schedule_interval_sec: 10
    max_runtime_sec: 0             # long-running daemon — scheduler should
                                   # never kill it; restart-on-exit handled
                                   # by scheduler core
    max_concurrency: 1
    shadow_mode: true              # SCHEDULER-level shadow: don't fork the
                                   # worker yet. Independent of QUEUE_WORKER_SHADOW.
    depends_on: []
    note: "Phase 3 SQL queue drainer for ORACLE. Replaces the 10s polling auto_executor in Phase 4."

  - name: md_ai_queue_worker
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m engine.workers.auto_executor --pillar md_ai"
    schedule_interval_sec: 10
    max_runtime_sec: 0
    max_concurrency: 1
    shadow_mode: true
    depends_on: []
    note: "Phase 3 SQL queue drainer for MD AI. Replaces the 10s polling auto_executor in Phase 4."

  # ── observability ────────────────────────────────────────────────────

  # ── Phase 4 DLQ Telegram alerter ─────────────────────────────────────
  - name: dlq_alerter
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && unset PYTHONHOME PYTHONPATH PYTHONSTARTUP PYTHONUSERBASE && export PYTHONNOUSERSITE=1 && for f in engine/.env .env.lp ops/bmi/.env; do [ -f \"$f\" ] && set -a && . \"$f\" && set +a; done && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m ops.risk.dlq_alerter --quiet"
    schedule_interval_sec: 60
    max_runtime_sec: 90
    max_concurrency: 1
    shadow_mode: false              # LIVE — alerting is read-only on capital
    depends_on: []
    note: "Phase 4 DLQ Telegram alerter — polls dead_letters every 60s, dedups by last_alerted_dlq_id."

  # ── #333 trustless alignment audit + drift alerter ───────────────────
  - name: trustless_alignment_audit
