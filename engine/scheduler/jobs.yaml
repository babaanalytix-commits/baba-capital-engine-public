  - name: lp_approval_gc
    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && unset PYTHONHOME PYTHONPATH PYTHONSTARTUP PYTHONUSERBASE && export PYTHONNOUSERSITE=1 && exec domains/multi_dex_trading_agent/.venv/bin/python3 -c 'from engine.strategies.lp_agile import approval_store; n=approval_store.gc_expired(); print(f\"[lp_approval_gc] removed={n}\")'"
