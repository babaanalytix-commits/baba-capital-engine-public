    cmd: bash -c "cd /Users/yomioguntona/baba/wealth-ecosystem && unset PYTHONHOME PYTHONPATH PYTHONSTARTUP PYTHONUSERBASE && export PYTHONNOUSERSITE=1 && for f in engine/.env .env.lp ops/bmi/.env; do [ -f \"$f\" ] && set -a && . \"$f\" && set +a; done && exec domains/multi_dex_trading_agent/.venv/bin/python3 -m ops.risk.pipeline_health_watcher"
    schedule_interval_sec: 1800    # 30 min — matches existing plist
    max_runtime_sec: 300
    max_concurrency: 1
